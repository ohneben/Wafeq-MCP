services:
  wafeq-mcp:
    build: .
    image: ghcr.io/ohneben/wafeq-mcp:latest
    container_name: wafeq-mcp
    restart: unless-stopped
    # Bound to 127.0.0.1 — reachable from this machine, not from the network.
    # Change this only together with MCP_SHARED_TOKEN.
    ports:
      - "127.0.0.1:${PORT:-8765}:8765"
    env_file:
      - .env
    environment:
      MCP_TRANSPORT: http
      HOST: 0.0.0.0
      PORT: 8765
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8765/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
